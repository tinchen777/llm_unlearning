# @package _global_

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /trainer: NeighborRedirect
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget_neighbor
  - override /data/datasets@data.retain: TOFU_QA_retain
  # the row index identifies which neighbour target a forget sample redirects to
  - override /collator: DataCollatorForSupervisedDatasetwithIndex
  - override /eval: tofu

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full
    attn_implementation: sdpa

forget_split: forget10
retain_split: retain90
holdout_split: holdout10
retain_logs_path: null
question_key: "question"
neighbors_path: data/fwt/neighbors_${forget_split}.json

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget_neighbor:
      args:
        hf_args:
          name: ${forget_split}
        neighbors_path: ${neighbors_path}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  args:
    warmup_epochs: 1.0
    learning_rate: 1e-5
    weight_decay: 0.01
    num_train_epochs: 10

task_name: ???
