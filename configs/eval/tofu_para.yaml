# @package eval.tofu
# FORGET-ONLY profile for the paraphrase evaluation (E6, TODO/exp/22 13b; select with `eval=tofu_para`): the forget metrics of `tofu.yaml`, computed the same way.
# Run it twice per model, with eval.tofu.question_key=question and =paraphrased_question (TOFU's forget*_perturbed splits carry `paraphrased_question`):
# the difference is how much of the forgetting survives a REWORDED QUESTION. (forget_Q_A_PARA_Prob of the full profile rewords the ANSWER, not the question.)
# Only forget splits are read, so the retain / holdout splits (which have no paraphrased questions) are never asked for one.
defaults:
  - tofu_metrics:
    - forget_Q_A_Prob
    - forget_Q_A_ROUGE
    - forget_truth_ratio

metrics: {}
handler: TOFUEvaluator
overwrite: true
forget_split: forget??
holdout_split: holdout??
retain_split: retain??
output_dir: null
retain_logs_path: null
probe_ref_path: null
question_key: question # question or paraphrased_question
batch_size: 8
