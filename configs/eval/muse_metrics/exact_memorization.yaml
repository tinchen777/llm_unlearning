  - /data/collators@collator: default_with_index

datasets:
  MUSE_forget_verbmem:
    args:
      hf_args:
        path: muse-bench/MUSE-${eval.muse.data_split}

handler: exact_memorization
batch_size: ${eval.muse.batch_size}