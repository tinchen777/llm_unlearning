# @package eval.muse.metrics.mia_zlib

defaults:
  - /data/packs@data.forget: default_right
  - /data/datasets/MUSE@data.forget.dataset: MUSE_MIA_forget
  - /data/packs@data.holdout: default_right
  - /data/datasets/MUSE@data.holdout.dataset: MUSE_MIA_holdout

data:
  forget:
    dataset:
      args:
        hf_args:
          path: muse-bench/MUSE-${eval.muse.data_split}
  holdout:
    dataset:
      args:
        hf_args:
          path: muse-bench/MUSE-${eval.muse.data_split}

handler: mia_zlib
loader_args:
  batch_size: ${eval.muse.batch_size}