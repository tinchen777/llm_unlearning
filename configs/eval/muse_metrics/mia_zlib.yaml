# @package eval.muse.metrics.mia_zlib

defaults:
  - /data/datasets@datasets: MUSE_MIA
  - /data/collators@collator: default_with_index

datasets:
  holdout:
    MUSE_MIA_holdout:
      args:
        hf_args:
          path: muse-bench/MUSE-${eval.muse.data_split}
  forget:
    MUSE_MIA_forget:
      args:
        hf_args:
          path: muse-bench/MUSE-${eval.muse.data_split}

handler: mia_zlib
batch_size: ${eval.muse.batch_size}