# @package eval.muse.metrics.retain_knowmem_ROUGE

defaults:
  - /data/datasets/MUSE@datasets: MUSE_retain_knowmem
  - /data/collators@collator: default_left
  - /generation@generation_args: default

datasets:
  args:
    hf_args:
      path: muse-bench/MUSE-${eval.muse.data_split}
    few_shot_dataset_hf_args:
      path: muse-bench/MUSE-${eval.muse.data_split}
    predict_with_generate: true

generation_args:
  max_new_tokens: 32
  stopwords:
    - "\n\n"
    - "\nQuestion"
    - "Question:"

handler: rouge
rouge_type: rougeL_f1
batch_size: ${eval.muse.batch_size}