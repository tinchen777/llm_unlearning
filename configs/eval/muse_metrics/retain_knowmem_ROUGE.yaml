# @package eval.muse.metrics.retain_knowmem_ROUGE

defaults:
  - /data/packs@data.train: default_left
  - /data/datasets/MUSE@data.train.dataset: MUSE_retain_knowmem
  - /generation@generation_args: default

data:
  train:
    dataset:
      args:
        hf_args:
          path: muse-bench/MUSE-${eval.muse.data_split}
        few_shot_dataset_hf_args:
          path: muse-bench/MUSE-${eval.muse.data_split}
        generation_mode: true

generation_args:
  max_new_tokens: 32
  stop_strings:
    - "\n\n"
    - "\nQuestion"
    - "Question:"

handler: rouge
rouge_type: rougeL_f1
loader_args:
  batch_size: ${eval.muse.batch_size}