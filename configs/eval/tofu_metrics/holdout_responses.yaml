# @package eval.tofu.metrics.holdout_responses
# Responses of the model to the questions of the `holdout` split: generations, ROUGE, ground-truth answer log-prob,
# refusal / degeneration / hallucination flags. The metric itself has no `agg_value`: it keeps one record per sample
# (`value_by_index`) and the mean of every text metric (`summary`); `expose` publishes the listed keys of that summary as
# metrics of their own (`holdout_<key>`), at the same level as the other metrics.

defaults:
  - /data/packs@data.train: default_left
  - /generation@generation_args: default
  - /eval@loader_args: tofu_loader

data:
  train:
    dataset:
      name: TOFU_QA_holdout
      args:
        hf_args:
          name: ${eval.tofu.holdout_split}
        question_key: ${eval.tofu.question_key}
        generation_mode: true

loader_args:
  batch_size: 16
  max_samples: 100 # fixed random subset of the questions, null: all

handler: responses
text_metrics: ALL # ALL | [rouge_scores, is_refusal, is_degenerate, is_hallucination, word_count, answer_logprob]
text_metrics_args:
  hallucination_rouge: 0.3 # confident answer with rougeL_recall below this = hallucination

expose_prefix: holdout
expose:
  - rougeL_recall
  - answer_prob
  - refusal_rate
  - degenerate_rate
  - hallucination_rate
