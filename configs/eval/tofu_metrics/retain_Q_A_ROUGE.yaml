# @package eval.tofu.metrics.retain_Q_A_ROUGE

defaults:
  - /data/packs@data.eval: default_left
  - /data/datasets/TOFU@data.eval.dataset: TOFU_QA_pert_retain
  - /generation@generation_args: default
  - /eval@loader_args: tofu_loader

data:
  eval:
    dataset:
      args:
        question_key: ${eval.tofu.question_key}
        generation_mode: true

handler: rouge
rouge_type: rougeL_recall