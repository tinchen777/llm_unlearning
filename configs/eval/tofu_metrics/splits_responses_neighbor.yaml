# @package eval.tofu.metrics.splits_responses
# Adds the NEAR neighbour questions (a csv with `author_id` / `neighbor_id`) to the datasets of `splits_responses`.
# Needs `neighbor_split` (e.g. neighbor10) in the experiment, or an explicit `data_files`.

defaults:
  - /data/datasets/TOFU@datasets.neighbor: TOFU_QA_csv

collator:
  args:
    metadata_keys:
      - author_id
      - neighbor_id

datasets:
  neighbor:
    name: TOFU_QA_neighbor
    args:
      hf_args:
        data_files: ${paths.data_dir}tofu/tofu_${neighbor_split}.csv
      question_key: ${eval.tofu.question_key}
      generation_mode: true
      extra_keys:
        - author_id
        - neighbor_id
