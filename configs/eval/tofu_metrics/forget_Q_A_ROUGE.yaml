# @package eval.tofu.metrics.forget_Q_A_ROUGE

defaults:
  - /data/datasets/TOFU@datasets: TOFU_QA
  - /data/collators@collator: default_left
  - /generation@generation_args: default
  - /eval@loader_args: tofu_loader

datasets:
  name: TOFU_QA_perturbed_forget
  args:
    hf_args:
      name: ${eval.tofu.forget_split}_perturbed
    question_key: ${eval.tofu.question_key}
    generation_mode: true

handler: rouge
rouge_type: rougeL_recall