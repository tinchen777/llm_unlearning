# @package eval.tofu.metrics.forget_Q_A_ROUGE

defaults:
  - /data/datasets@datasets: TOFU_QA_forget
  - /data/collators@collator: default_with_index
  - ../../generation@generation_args: default

datasets: # override as needed
  TOFU_QA_forget:
    args:
      hf_args:
        name: ${eval.tofu.forget_split}_perturbed
      question_key: ${eval.tofu.question_key}
      predict_with_generate: true

collator:
  args:
    padding_side: left

handler: rouge
rouge_type: rougeL_recall
batch_size: ${eval.tofu.batch_size}