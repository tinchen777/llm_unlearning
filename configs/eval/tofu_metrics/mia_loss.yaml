# @package eval.tofu.metrics.mia_loss

defaults:
  - /data/datasets/TOFU@datasets: TOFU_MIA
  - /data/collators@collator: default_right

datasets:
  forget:
    name: TOFU_QA_perturbed_forget
    args:
      hf_args:
        name: ${eval.tofu.forget_split}_perturbed
      question_key: ${eval.tofu.question_key}
  holdout:
    args:
      hf_args:
        name: ${eval.tofu.holdout_split}

handler: mia_loss
batch_size: ${eval.tofu.batch_size}