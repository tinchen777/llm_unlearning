# @package eval.tofu.metrics.mia_gradnorm

defaults:
  - /data/packs@data.forget: default_right
  - /data/packs@data.holdout: default_right
  - /eval@loader_args: tofu_loader

data:
  forget:
    dataset:
      name: TOFU_QA_perturbed_forget
      args:
        hf_args:
          name: ${eval.tofu.forget_split}_perturbed
        question_key: ${eval.tofu.question_key}
  holdout:
    dataset:
      name: TOFU_QA_holdout
      args:
        hf_args:
          name: ${eval.tofu.holdout_split}

loader_args:
  batch_size: 1

handler: mia_gradnorm
p: 2