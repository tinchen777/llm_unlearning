# @package eval.tofu.metrics.splits_responses

defaults:
  - /data/datasets/TOFU@datasets: TOFU_QA_ALL_SPLIT
  - /data/collators@collator: default_left
  - /generation@generation_args: default
  - /eval@loader_args: tofu_loader

datasets:
  forget:
    args:
      hf_args:
        name: ${eval.tofu.forget_split}
      question_key: ${eval.tofu.question_key}
      generation_mode: true
  retain:
    args:
      hf_args:
        name: ${eval.tofu.retain_split}
      question_key: ${eval.tofu.question_key}
      generation_mode: true
  holdout:
    args:
      hf_args:
        name: ${eval.tofu.holdout_split}
      question_key: ${eval.tofu.question_key}
      generation_mode: true

loader_args:
  batch_size: 16
  max_samples: 100 # fixed random subset of every dataset, null: all


handler: responses
text_metrics: ALL
text_metrics_args:
  hallucination_rouge: 0.3
  # confident answer with rougeL_recall below this = hallucination