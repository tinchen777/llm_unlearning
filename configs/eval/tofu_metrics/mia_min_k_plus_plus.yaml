# @package eval.tofu.metrics.mia_min_k_plus_plus

defaults:
  - /data/datasets/TOFU@datasets: TOFU_QA_MIA
  - /data/collators@collator: default_right
  - /eval@loader_args: tofu_loader

datasets:
  forget:
    name: TOFU_QA_perturbed_forget
    args:
      hf_args:
        name: ${eval.tofu.forget_split}_perturbed
      question_key: ${eval.tofu.question_key}
  holdout:
    args:
      hf_args:
        name: ${eval.tofu.holdout_split}

handler: mia_min_k_plus_plus
k: 0.4