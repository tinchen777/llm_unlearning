# @package eval.tofu.metrics.forget_Q_A_PERT_ROUGE

defaults:
  - /data/datasets@datasets: TOFU_QA_forget_pert
  - /data/collators@collator: default_left
  - /generation@generation_args: default

datasets:
  TOFU_QA_forget_pert:
    args:
      hf_args:
        name: ${eval.tofu.forget_split}_perturbed
      question_key: ${eval.tofu.question_key}
      predict_with_generate: true

handler: rouge
rouge_type: rougeL_recall
batch_size: ${eval.tofu.batch_size}