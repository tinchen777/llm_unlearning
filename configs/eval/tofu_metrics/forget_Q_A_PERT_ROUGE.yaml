# @package eval.tofu.metrics.forget_Q_A_PERT_ROUGE

defaults:
  - /data/packs@data.eval: default_left
  - /data/datasets/TOFU@data.eval.dataset: TOFU_QA_pert_forget_pert
  - /generation@generation_args: default
  - /eval@loader_args: tofu_loader

data:
  eval:
    dataset:
      args:
        hf_args:
          name: ${eval.tofu.forget_split}_perturbed
        question_key: ${eval.tofu.question_key}
        generation_mode: true

handler: rouge
rouge_type: rougeL_recall