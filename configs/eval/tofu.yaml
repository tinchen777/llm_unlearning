# @package eval.tofu

defaults:
  - tofu_metrics:
    - forget_truth_ratio
    - forget_quality
    - forget_Q_A_Prob
    - forget_Q_A_ROUGE
    - model_utility
    - privleak
    - extraction_strength
    - exact_memorization
    - mia_min_k_plus_plus
    - mia_min_k
    - mia_loss
    - mia_zlib
    - mia_gradnorm
    - forget_responses
    - retain_responses
    - holdout_responses

    # - mia_reference # set reference model path appropriately
    # - forget_Q_A_gibberish

metrics: {}
handler: TOFUEvaluator
overwrite: false
forget_split: forget??
holdout_split: holdout??
retain_split: retain??

retain_logs_path: ${paths.root_dir}/saves/eval/TOFU/tofu_${model.base_name}_${retain_split}/TOFU_EVAL.json
question_key: question # question or paraphrased_question
batch_size: 8