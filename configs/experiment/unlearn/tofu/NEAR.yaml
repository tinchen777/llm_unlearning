# @package _global_
# Neighbour-redirection experiment (LUNAR-style, the redirection target is attribute-matched unseen neighbours).
#   step 0  src/METHOD/NEAR/probe.py      ANALYSIS of one model: responses of base / full / retain on forget, neighbor, retain,
#                                holdout + per-layer activation diagnostics. Nothing below reads its outputs.
#           src/METHOD/NEAR/neighbor_compare.py  full - retain difference of the AUCs (narrows down the candidate layers)
#   step 1  src/METHOD/NEAR/r_uv.py          r_UV per forget author, for K neighbours (on the FULL model)      -> r_uv.pt
#           src/METHOD/NEAR/select_layer.py  LUNAR-style layer selection by inference-time steering
#                                -> k<K>_c<coeff>_<shift_mode>/layer_selection.json
#   step 2  src/METHOD/NEAR/w_down.py        train W_down of the selected layer (AdamW or closed form) -> k<K>_c<coeff>_<mode>/l<layers>[_cf]/model/
#   step 3  src/eval.py (TOFU metrics) + src/METHOD/NEAR/probe.py on the edited model (scripts/NEAR/4_eval.sh)
# The chain is linked by files: select_layer.py reads r_uv.pt, w_down.py reads layer_selection.json (and through it r_uv.pt),
# so only `layer_selection_path` has to be passed to w_down.py; the probe of an edited model takes `probe.activations.from_r_uv`.

defaults:
  - /generation@generation_args: default
  - /data/packs@data.forget: default_left
  - /data/packs@data.neighbor: default_left
  - /data/packs@data.neighbor_heldout: default_left
  - /data/packs@data.retain: default_left
  - /data/packs@data.holdout: default_left
  - override /data: null
  - override /data/datasets@data.neighbor.dataset: TOFU/TOFU_QA_csv
  - override /data/datasets@data.neighbor_heldout.dataset: TOFU/TOFU_QA_csv

mode: NEAR
forget_split: forget10
neighbor_split: neighbor10
retain_split: retain90
holdout_split: holdout10

data:
  forget:
    dataset:
      name: TOFU_gen_QA_forget
      args:
        hf_args:
          name: ${forget_split}
        generation_mode: true
  # The neighbour csv has a `split` column: `train` neighbours (10 per author, ranked by `train_rank`, K = the first K by rank) define r_UV and
  # are kept as retained tokens by W_down; `heldout` neighbours (5 per author) are only for evaluating (selection reference, responses).
  neighbor:
    dataset:
      name: TOFU_gen_QA_neighbor
      args:
        hf_args:
          data_files: ${paths.data_dir}tofu/tofu_${neighbor_split}.csv
        row_filter:
          split: train
        generation_mode: true
        extra_keys:
          - author_id
          - neighbor_id
          - qa_id
          - source_question
          - train_rank
    collator:
      args:
        metadata_keys:
          - author_id
          - neighbor_id
          - train_rank
          - qa_id
          - source_question
  neighbor_heldout:
    dataset:
      name: TOFU_gen_QA_neighbor_heldout
      args:
        hf_args:
          data_files: ${data.neighbor.dataset.args.hf_args.data_files}
        row_filter:
          split: heldout
        generation_mode: true
        extra_keys:
          - author_id
          - neighbor_id
    collator:
      args:
        metadata_keys:
          - author_id
          - neighbor_id
  retain:
    dataset:
      name: TOFU_gen_QA_retain
      args:
        hf_args:
          name: ${retain_split}
        generation_mode: true
  holdout:
    dataset:
      name: TOFU_gen_QA_holdout
      args:
        hf_args:
          name: ${holdout_split}
        generation_mode: true

generation_args:
  max_new_tokens: 128


basic:
  qa_per_author: 20
  # TOFU: the 20 QAs of an author are contiguous -> author = row_index // qa_per_author + author_offset

  author_offset: 0
  # must make that author numbering equal to `author_id` of the neighbour csv (checked before running)

  coeff: 1.0
  # forget target = original MLP output + coeff * r_UV[author]   (LUNAR: 2.0)

  k: 5
  # which K of the ablation to train with (must be in ruv.ks)

  shift_mode: eoi  # all | eoi
  # all: `the faithful baseline`. every token of a forget prompt gets the SAME r_UV[ref_position] - this is the paper (Eq. 4: "across all token positions"; position -1) and LUNAR's released code. The shared prompt prefix (system prompt, ...) has IDENTICAL inputs in forget and retain prompts but contradicting targets (+r vs +0), which the regression averages.
  # eoi: `the variant`. only the end-of-instruction tokens get their own r_UV[position], other tokens keep their output (no conflict).

  ref_position: -1
  # only for shift_mode=all: which saved position is used

  hallucination_rouge: 0.3
  # confident answer with rougeL_recall below this = hallucination

# ---- src/METHOD/NEAR/probe.py : step 1 probe (+ per-layer diagnostics) ---------------------------------
probe:
  batch_size: 16

  responses:
    max_gen_samples: 100 # null: all
    hallucination_rouge: ${basic.hallucination_rouge}

  activations:
    # sets pooled for the `seen | unseen` AUC. Defaults are for the FULL model; for a RETAIN model pass [retain] as seen and [forget, neighbor, holdout] as unseen
    seen: [forget, retain]
    unseen: [neighbor, holdout]

    max_act_samples: 200
    # fixed random subset per split for the activations; null: all

    forget: forget # split name of the data to forget
    reference: neighbor # split name of the redirection target

    point: block_out # block_out | mlp_out | down_proj_in | resid_mid
    positions: null  # null: end-of-instruction template tokens, as in LUNAR | [-1] for the last token
    layers: null # null: all decoder layers | [10, 11]

    qa_per_author: ${basic.qa_per_author}
    author_offset: ${basic.author_offset}

    from_r_uv: null
    # null: positions / layers / point / qa_per_author / author_offset above (analysis of an original model, before any r_UV exists).
    # path of an r_uv.pt: those are read from it instead (the probe of an edited model, comparable with that run)

# ---- src/METHOD/NEAR/r_uv.py : r_UV per forget author, ablated over the number K of neighbours -----------
ruv:
  batch_size: 32
  ks: [1, 3, 5, 10] # K neighbours per author used as reference (nested: the K train neighbours with the smallest `train_rank`; 10 train neighbours per author)
  order: rank # rank = by `train_rank` | random = the first K of a fixed random order (a csv without ranks)
  qa_per_author: ${basic.qa_per_author}
  author_offset: ${basic.author_offset}

  point: block_out
  # block_out | mlp_out  (r_UV must live in d_model space for W_down training)
  positions: null
  # null: end-of-instruction template tokens, as in LUNAR | [-1] for the last token
  layers: null
  # null: all decoder layers | [10, 11]

  save_group_means: true
  # also keep every (author, neighbour) mean in r_uv.pt (to try other K / orders without re-running)

# ---- src/METHOD/NEAR/select_layer.py : LUNAR-style layer selection by inference-time steering ---------------
select:
  r_uv_path: ${paths.output_dir}/r_uv.pt
  # written by src/METHOD/NEAR/r_uv.py
  k: ${basic.k}
  coeff: ${basic.coeff}
  shift_mode: ${basic.shift_mode}
  ref_position: ${basic.ref_position}
  layers: null
  # candidate layers (null -> `layer_fraction`, else every layer of r_uv.pt)
  layer_fraction: null
  # window of relative depths, e.g. [0.4, 0.8]; LUNAR's selected layers are at 50-75 % of the depth
  unseen_splits: [neighbor_heldout, holdout]
  # the behaviour the steered forget answers should match
  criterion: unseen_gap
  # unseen_gap (look like a stranger) | rougeL_recall | answer_logprob (max knowledge removal)
  max_degenerate: 0.1
  # layers whose steered answers are degenerate more often are not selected
  ud_weight: 0.0
  # >0: the criterion + ud_weight * ud, `ud` = black-box detectability of the steered forget answers (the TAS refusal score / gibberish /
  # canned answers tell them from the answers to the unseen splits; 0 = not at all, 1 = perfectly): prefer layers whose answers do not
  # give away what was unlearned. 0 = only recorded
  footprint_weight: 0.0
  # >0: + footprint_weight * footprint, footprint = coeff * ||r_UV|| / ||mean forget activation||, a proxy of how visible the shift is to a
  # white-box observer. 0 = only recorded
  max_ud: null
  # layers whose `ud` is larger are not selected (null: no limit; ignored if no layer is below)
  tas_embedder: null
  # encoder of the semantic channel of the TAS refusal score of the steered answers (e.g. sentence-transformers/all-MiniLM-L6-v2); null: regexes only
  max_samples: 64
  # fixed random subset of forget prompts
  batch_size: 16
  hallucination_rouge: ${basic.hallucination_rouge}

# ---- src/METHOD/NEAR/w_down.py : train W_down (MLP output projection) of the chosen layers ---------------
wdown:
  layer_selection_path: null
  # the layer_selection.json of select_layer.py this run follows: k, coeff, shift_mode, ref_position, the selected layer and
  # (through its `r_uv_path`) r_uv.pt are READ from it, so they cannot drift apart between the stages.
  # Required unless layers and all of r_uv_path / k / coeff / shift_mode / ref_position below are given.
  layers: auto
  # auto: the layer selected in `layer_selection_path`; or explicit, e.g. [10] (then only the layer differs from the selection)

  r_uv_path: null
  k: null
  coeff: null
  shift_mode: null
  ref_position: null
  # null: taken from `layer_selection_path` (the usual case). Only for a run WITHOUT a selection file; given together with one, they must agree with it (else an error).

  # data whose MLP output must not change. The neighbours are the redirection TARGET, so they must not move either; holdout is kept out of training as the clean "never seen" control of the evaluation.
  multi_layer: same # several layers: `same` = every layer adds coeff * its whole r_UV; `increment` = every layer adds its share, so the total is coeff * r_UV of the LAST layer
  sequential: false # several layers: true = after each layer record the inputs of the next one again on the model edited so far (a layer repairs what the lower edits did to its input)
  include_answer: false # true: train on the tokens of prompt AND answer (shift_mode=all only), not on the prompt only
  kl:
    # stage 2 (src/METHOD/NEAR/kl_refine.py): after the local regression train the W_down of the edited layers TOGETHER through the whole model with
    # forget_weight*rel_MSE(forget) + retain_weight*rel_MSE(retain) + weight*KL(original model on the neighbour prompt || edited model on the forget
    # prompt, both given the neighbour answer prefix). Needs include_answer=true. The target is the ORIGINAL model only (no retain model).
    enabled: false
    steps: 100
    lr: 2.0e-5
    weight: 1.0 # weight of the KL term; 0 = only the end-to-end MSE (a control)
    n_tokens: 8 # first answer tokens of the neighbour answer that the KL compares
    batch_size: 8 # (forget prompt, neighbour answer) pairs per step; a forget / retain batch is wdown.batch_size
    retain_max_samples: 128 # per retain split
    forget_prob_weight: 0.0 # mu: hinge on the probability of the TRUE forget answer (the evaluation's forget_Q_A_Prob), 0 = off; pushes it down to forget_prob_target, not beyond
    forget_prob_target: 0.17 # the retain model's forget_Q_A_Prob on forget01 (1B); use the retain model's value of the setting
  answer_coeff: null # include_answer only: factor on `coeff` for the ANSWER tokens (e.g. 0.5); null = the same shift as the prompt
  retain_splits: [retain, neighbor]
  retain_max_samples: 512
  # random subset of each retain split (all tokens of a sample are used)
  forget_weight: 1.0
  retain_weight: 1.0
  hallucination_rouge: ${basic.hallucination_rouge}

  solver: adam
  # adam: AdamW + ExponentialLR (as LUNAR's code, needs lr / epochs); 
  # closed_form: LUNAR Eq. 9, ridge regression of the weight change, no lr / epochs (checked against lstsq and against `adam` in tests/test_redirect.py).

  ridge: 1.0e-3
  # closed_form only: lambda as a FRACTION of mean(diag(X^T X)); 0 = plain least squares; shrinks the edit lr of LUNAR (appendix C.3, Table 5, TOFU): Llama2-7B 1e-2, Gemma-7B 1e-3, Qwen2-7B 1e-2, Llama3-8B 5e-3, Qwen2.5-7B 5e-3
  lr: 5.0e-3
  lr_gamma: 0.9
  # ExponentialLR per epoch (as LUNAR)
  epochs: 20
  # LUNAR: 20 (config/forget.yaml; appendix B cost analysis)
  batch_size: 64
  # forget tokens per step, plus the same number of random retain tokens (LUNAR: 64)
  weight_decay: 0.0
  # LUNAR uses AdamW's default 0.01
  responses_splits: [forget, neighbor_heldout, retain, holdout]
  # splits whose responses are written before / after the edit
  max_gen_samples: 32
  # fixed random subset per split
  gen_batch_size: 16
  save_model: true
  # save the edited model to <output_dir>/k<K>_c<coeff>_<mode>/l<layers>[_cf]/model (needed by step 4)
