# @package _global_

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /trainer: GradAscent
  - override /data: unlearn
  - override /eval: tofu

forget_split: forget10
retain_split: retain90
holdout_split: holdout10
retain_logs_path: null
question_key: question

model:
  pretrained:
    name_or_path: open-unlearning/tofu_${model.base_name}_full

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

data:
  train:
    datasets:
      forget:
        name: TOFU_QA_forget
        args:
          hf_args:
            name: ${forget_split}
      retain:
        name: TOFU_QA_retain
        args:
          hf_args:
            name: ${retain_split}
      COMBINE:
        name: TOFU_balanced_unlearn
        handler: BalancedUnlearnDataset
        args:
          anchor: forget

trainer:
  args:
    warmup_epochs: 1.0 # custom parameter
    learning_rate: 1e-5
    weight_decay: 0.01
    num_train_epochs: 10
    # save_strategy: steps
    # save_steps: 0.5