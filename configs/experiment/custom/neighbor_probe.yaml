# @package _global_
# Probe a model on three question sets (src/neighbor.py):
#   forget / neighbor / retain  ->  responses_<split>.json  (generated answers to read)
#                               ->  activations.pt          (per-layer mean activations + r_UV)
#   r_UV[l] = mean(a_l | probe.reference split) - mean(a_l | probe.forget split)
#
# Every split must be PROMPT-ONLY (`predict_with_generate: true`, so the last tokens of
# `input_ids` are the end-of-instruction template tokens) and LEFT-padded (batched generation).

defaults:
  - /generation@generation_args: default
  - override /data: probe
  - override /data/datasets@data.forget.datasets: TOFU_QA_forget
  - override /data/datasets@data.neighbor.datasets: TOFU_QA_neighbor
  - override /data/datasets@data.retain.datasets: TOFU_QA_retain

mode: neighbor

forget_split: forget10
neighbor_split: neighbor10
retain_split: retain90

data:
  forget:
    datasets:
      TOFU_QA_forget:
        args:
          hf_args:
            name: ${forget_split}
          predict_with_generate: true
    collator:
      args:
        padding_side: left
        metadata_keys: [index]
  neighbor:
    datasets:
      TOFU_QA_neighbor:
        args:
          hf_args:
            data_files: ${paths.data_dir}/tofu/tofu_${neighbor_split}.csv
          predict_with_generate: true
    collator:
      args:
        padding_side: left
        metadata_keys: [index, author_id, neighbor_id]
  retain:
    datasets:
      TOFU_QA_retain:
        args:
          hf_args:
            name: ${retain_split}
          predict_with_generate: true
    collator:
      args:
        padding_side: left
        metadata_keys: [index]

generation_args:
  max_new_tokens: 128

probe:
  batch_size: 16
  max_gen_samples: 32 # samples per split whose responses are generated (null -> all); loaders are shuffled
  forget: forget # split name of the data to forget
  reference: neighbor # split name of the redirection target
  point: block_out # block_out | mlp_out | down_proj_in | resid_mid
  # positions: [-1]  # default (omitted): end-of-instruction template tokens, as in LUNAR
  # layers: [10, 11] # default (omitted): all decoder layers
