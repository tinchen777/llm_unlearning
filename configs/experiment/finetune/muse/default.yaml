# @package _global_

defaults:
  - override /model: Llama-2-13b-hf
  - override /trainer: finetune
  - override /data: default
  - override /data/datasets@data.train.datasets: MUSE_train
  - override /eval: muse

mode: finetune
data_split: News
data_sub_set: full   # full or retain

data:
  train:
    datasets:
      MUSE_train:
        args:
          hf_args:
            path: tamarsonha/MUSE-${data_split}-Train
            split: ${data_sub_set}

trainer:
  args:
    learning_rate: 1e-5
    weight_decay: 0.01
    warmup_epochs: 1.0  # custom parameter
    num_train_epochs: 10