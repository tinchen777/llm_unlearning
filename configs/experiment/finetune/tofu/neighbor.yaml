# @package _global_
# TODO
defaults:
  - /data/subdataset@data.neighbor: default
  - override /model: Llama-3.2-1B-Instruct
  - override /trainer: finetune
  - override /data: default
  - override /data/datasets/TOFU@data.train.datasets: TOFU_QA_forget
  - override /data/datasets/TOFU@data.neighbor.datasets: TOFU_QA_csv
  - override /eval: tofu

mode: neighbor
forget_split: forget10
holdout_split: holdout10
neighbor_split: neighbor10
retain_logs_path: null

trainer:
  args:
    learning_rate: 1e-5
    weight_decay: 0.01
    warmup_epochs: 1.0 # custom parameter
    num_train_epochs: 5

model:
  model_args:
    attn_implementation: sdpa

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    neighbor_split: ${neighbor_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

data:
  train:
    datasets:
      TOFU_QA_forget:
        args:
          hf_args:
            name: ${forget_split}
        predict_with_generate: true
  neighbor:
    datasets:
      TOFU_QA_neighbor:
        args:
          hf_args:
            data_files: ${paths.data_dir}/tofu/tofu_${neighbor_split}.csv
        predict_with_generate: true
    collator:
      args:
        metadata_keys:
          - author_id
          - neighbor_id