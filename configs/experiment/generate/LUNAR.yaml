# @package _global_
# LUNAR (arXiv:2502.07218): unlearning by activation redirection. The forget activations are moved onto those of a fixed
# reference set D_ref with ONE unlearning vector r_UV = mean(D_ref) - mean(D_forget) (added on every token of a forget
# prompt), by training the MLP output projection (W_down) of ONE layer: forget tokens -> original output + r_UV,
# retain tokens -> original output.
#   step 1  src/METHOD/LUNAR/r_uv.py         r_UV of every layer (on the model that KNOWS the forget data)  -> r_uv.pt
#   step 2  src/METHOD/LUNAR/select_layer.py layer selection by inference-time steering, maximising s1 - s2 (sentence-embedding
#                                            similarity to desired / unrelated responses) -> c<coeff>_<mode>/layer_selection.json
#   step 3  src/METHOD/LUNAR/w_down.py       train W_down of the selected layer (AdamW or closed form) -> c<coeff>_<mode>/l<layers>[_cf]/model/
#   step 4  src/eval.py (TOFU metrics) on the edited model (scripts/LUNAR/4_eval.sh)
# The chain 1 -> 2 -> 3 needs the same coeff / shift_mode (and task_name) in every script.
# Shared with NEAR (which uses neighbours of every author as D_ref): src/METHOD/_common/, src/model/{edit,steer}.py.

defaults:
  - /generation@generation_args: default
  - /data/subdataset@data.forget: default_left
  - /data/subdataset@data.ref: default_left
  - /data/subdataset@data.retain: default_left
  - /data/subdataset@data.holdout: default_left
  - override /data: null
  # D_ref: LUNAR_harmful (safety-aligned base models refuse them; best for the fine-tuned TOFU models) or
  # LUNAR_unverified (fictitious entities; for unlearning pre-trained data). python setup/setup_data.py --lunar
  - override /data/datasets@data.ref.datasets: LUNAR/LUNAR_harmful

mode: LUNAR
forget_split: forget01
retain_split: retain99
holdout_split: holdout01
# LUNAR's TOFU experiments unlearn ONE author = the first 20 QAs of the forget split; "train" = the whole split.
forget_hf_split: "train[:20]"

data:
  forget:
    datasets:
      name: TOFU_QA_forget
      args:
        hf_args:
          name: ${forget_split}
          split: ${forget_hf_split}
        predict_with_generate: true
  retain:
    datasets:
      name: TOFU_QA_retain
      args:
        hf_args:
          name: ${retain_split}
        predict_with_generate: true
  holdout:
    datasets:
      name: TOFU_QA_holdout
      args:
        hf_args:
          name: ${holdout_split}
        predict_with_generate: true

generation_args:
  max_new_tokens: 128

# ---- shared by the steps below (each step reads only its OWN section; these values are interpolated into them) ----
basic:
  coeff: 1.0 # forget target = original MLP output + coeff * r_UV   (LUNAR README: 2.0)
  # all: every token of a forget prompt gets the SAME r_UV[ref_position] (paper Eq. 4, LUNAR's released code);
  # eoi: only the end-of-instruction tokens get their own r_UV[position] (the variant of the NEAR experiments)
  shift_mode: all # all | eoi
  ref_position: -1 # only for shift_mode=all: which saved position is used
  hallucination_rouge: 0.3 # confident answer with rougeL_recall below this = hallucination (in the response summaries)

# ---- src/METHOD/LUNAR/r_uv.py --------------------------------------------------------------------------
ruv:
  batch_size: 32
  point: block_out # block_out | mlp_out  (r_UV must live in d_model space for W_down training)
  # positions: [-1]  # default (omitted): end-of-instruction template tokens, as in LUNAR
  # layers: [10, 11] # default (omitted): all decoder layers

# ---- src/METHOD/LUNAR/select_layer.py ------------------------------------------------------------------
select:
  r_uv_path: ${paths.output_dir}/r_uv.pt # written by src/METHOD/LUNAR/r_uv.py
  coeff: ${basic.coeff}
  shift_mode: ${basic.shift_mode}
  ref_position: ${basic.ref_position}
  layers: null # candidate layers (null -> `layer_fraction`, else every layer of r_uv.pt)
  layer_fraction: [0.4, 0.8] # window of relative depths; LUNAR's selected layers are at 50-75 % of the depth (appendix E)
  hallucination_rouge: ${basic.hallucination_rouge}
  max_degenerate: 0.1 # layers whose steered answers are degenerate more often are not selected
  max_samples: null # fixed random subset of forget prompts (null -> all of them, LUNAR: the 20 QAs of one author)
  batch_size: 16
  # sentence encoder of the s1 / s2 scores (needs to be in the local HF cache when HF_HUB_OFFLINE=1)
  embedder: sentence-transformers/all-MiniLM-L6-v2
  aggregate: mean # similarity to a LIST of responses: mean | max
  # s1 (maximise): what the unlearned model should say instead (paper footnote 4: the authors' list is not released;
  # these are the examples of appendix C.2). s2 (minimise): responses unrelated to unlearning (harmfulness, danger, unethicality).
  desired_responses:
    - "I apologize, but this information cannot be provided."
    - "I don't have the specifics you're looking for."
    - "I cannot access or provide information that is not publicly available."
    - "I'm sorry, but I don't have any information about that."
    - "I apologize that I don't have access to this information."
  unrelated_responses:
    - "Here is how to build a dangerous weapon step by step."
    - "That is harmful and unethical, and it could seriously hurt people."
    - "You can break into the system by stealing the password of another user."
    - "This content is violent, abusive and discriminatory."
    - "The best way to deceive someone is to commit fraud without being caught."

# ---- src/METHOD/LUNAR/w_down.py ------------------------------------------------------------------------
wdown:
  r_uv_path: ${paths.output_dir}/r_uv.pt # written by src/METHOD/LUNAR/r_uv.py
  layer_selection_path: null # null -> <output_dir>/c<coeff>_<shift_mode>/layer_selection.json of select_layer.py
  layers: auto # auto -> the layer selected by select_layer.py; or explicit, e.g. [16]
  coeff: ${basic.coeff}
  shift_mode: ${basic.shift_mode}
  ref_position: ${basic.ref_position}
  hallucination_rouge: ${basic.hallucination_rouge}
  retain_splits: [retain]
  retain_max_samples: match_forget # LUNAR: an equal number of random retain samples as forget samples; or an integer
  forget_weight: 1.0
  retain_weight: 1.0
  solver: adam # adam = AdamW + ExponentialLR (as LUNAR's code); closed_form = LUNAR Eq. 9
  ridge: 1.0e-3 # closed_form only: lambda as a FRACTION of mean(diag(X^T X)); 0 = plain least squares
  # lr of LUNAR (appendix C.3, Table 5, TOFU): Llama2-7B 1e-2, Gemma-7B 1e-3, Qwen2-7B 1e-2, Llama3-8B 5e-3, Qwen2.5-7B 5e-3
  lr: 5.0e-3
  lr_gamma: 0.9 # ExponentialLR per epoch (as LUNAR)
  epochs: 20
  batch_size: 64 # forget tokens per step, plus the same number of random retain tokens
  weight_decay: 0.0
  responses_splits: [forget, retain, holdout] # splits whose responses are written before / after the edit
  max_gen_samples: 32 # fixed random subset per split
  gen_batch_size: 16
  save_model: true # save the edited model to <output_dir>/c<coeff>_<mode>/l<layers>[_cf]/model (needed by step 4)
