# @package _global_
# Neighbour-redirection experiment (LUNAR-style, the redirection target is attribute-matched unseen neighbours).
#   step 0  src/METHOD/NEAR/probe.py      ANALYSIS of one model: responses of base / full / retain on forget, neighbor, retain,
#                                holdout + per-layer activation diagnostics. Nothing below reads its outputs.
#           src/METHOD/NEAR/neighbor_compare.py  full - retain difference of the AUCs (narrows down the candidate layers)

defaults:
  - /eval/tofu_metrics:
    - neighbor_responses
    - activation_probe
    - unlearning_detectability
  - override /model: tofu/tofu_Llama-3.2-1B-Instruct_full
  - override /eval: tofu

mode: eval

forget_split: forget10??
retain_split: retain90??
neighbor_split: neighbor10??
holdout_split: holdout10??
question_key: question

eval:
  tofu:
    forget_split: ${forget_split}
    retain_split: ${retain_split}
    neighbor_split: ${neighbor_split}
    holdout_split: ${holdout_split}
    overwrite: true
    question_key: ${question_key}
