# A split that yields forget AND retain samples together (unlearning training): `forget` and `retain` are datasets of their own
# (override them in the experiment, e.g. `data.train.dataset.forget`), `COMBINE` builds the dataset the trainer sees.
defaults:
  - /data/datasets@forget: TOFU/TOFU_QA
  - /data/datasets@retain: TOFU/TOFU_QA

COMBINE:
  name: null
  handler: BalancedUnlearnDataset
  args:
    anchor: forget
