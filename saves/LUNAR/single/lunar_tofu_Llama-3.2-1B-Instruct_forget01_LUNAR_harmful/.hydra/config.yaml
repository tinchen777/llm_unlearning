model:
  pretrained:
    args:
      device_map: cuda
      attn_implementation: sdpa
    handler: AutoModelForCausalLM
    name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full
    dtype: bfloat16
  base_name: Llama-3.2-1B-Instruct
  tokenizer:
    handler: AutoTokenizer
    name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full
    args: {}
  template_args:
    apply_chat_template: true
    system_prompt: You are a helpful assistant.
    system_prompt_with_special_tokens: '<|begin_of_text|><|start_header_id|>system<|end_header_id|>


      You are a helpful assistant.<|eot_id|>'
    user_start_tag: '<|start_header_id|>user<|end_header_id|>


      '
    user_end_tag: <|eot_id|>
    asst_start_tag: '<|start_header_id|>assistant<|end_header_id|>


      '
    asst_end_tag: <|eot_id|>
    date_string: 10 Apr 2025
seed: 42
mode: LUNAR
task_name: single/lunar_tofu_Llama-3.2-1B-Instruct_forget01_LUNAR_harmful
trainer:
  args:
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 16
    gradient_accumulation_steps: 4
    learning_rate: 1.0e-05
    bf16: true
    bf16_full_eval: true
    logging_steps: 5
    output_dir: ${paths.output_dir}
    report_to: tensorboard
    ddp_find_unused_parameters: null
    gradient_checkpointing: false
    remove_unused_columns: false
    optim: paged_adamw_32bit
    save_strategy: 'no'
    save_only_model: true
    weight_decay: 0.0
    do_train: true
    do_eval: true
    eval_on_start: true
    eval_strategy: epoch
    num_train_epochs: 10
    seed: ${seed}
  handler: FinetuneTrainer
paths:
  root_dir: .
  data_dir: ${paths.root_dir}/data/
  output_dir: ${paths.root_dir}/saves/${mode}/${task_name}
  work_dir: ${hydra:runtime.cwd}
generation_args:
  do_sample: false
  top_p: null
  temperature: null
  max_length: null
  max_new_tokens: 128
  use_cache: true
data:
  forget:
    dataset:
      name: TOFU_QA_forget
      handler: QADataset
      args:
        hf_args:
          name: ${forget_split}
          split: ${forget_hf_split}
          path: locuslab/TOFU
        question_key: question
        answer_key: answer
        max_length: 512
        generation_mode: true
    collator:
      handler: DataCollatorForNestedData
      args:
        padding_side: left
        index_to_tensor: false
  ref:
    dataset:
      name: LUNAR_harmful
      handler: QADataset
      args:
        hf_args:
          path: json
          data_files: ./data/lunar/harmful.json
          split: train
        question_key: instruction
        answer_key: null
        max_length: 512
        generation_mode: true
    collator:
      handler: DataCollatorForNestedData
      args:
        padding_side: left
        index_to_tensor: false
  retain:
    dataset:
      name: TOFU_QA_retain
      handler: QADataset
      args:
        hf_args:
          name: ${retain_split}
          split: train
          path: locuslab/TOFU
        question_key: question
        answer_key: answer
        max_length: 512
        generation_mode: true
    collator:
      handler: DataCollatorForNestedData
      args:
        padding_side: left
        index_to_tensor: false
  holdout:
    dataset:
      name: TOFU_QA_holdout
      handler: QADataset
      args:
        hf_args:
          name: ${holdout_split}
          split: train
          path: locuslab/TOFU
        question_key: question
        answer_key: answer
        max_length: 512
        generation_mode: true
    collator:
      handler: DataCollatorForNestedData
      args:
        padding_side: left
        index_to_tensor: false
forget_split: forget01
retain_split: retain99
holdout_split: holdout01
forget_hf_split: train[:20]
basic:
  coeff: 1.0
  shift_mode: all
  ref_position: -1
  hallucination_rouge: 0.3
ruv:
  batch_size: 32
  point: block_out
select:
  r_uv_path: ${paths.output_dir}/r_uv.pt
  coeff: ${basic.coeff}
  shift_mode: ${basic.shift_mode}
  ref_position: ${basic.ref_position}
  layers: null
  layer_fraction:
  - 0.4
  - 0.8
  hallucination_rouge: ${basic.hallucination_rouge}
  max_degenerate: 0.1
  max_samples: null
  batch_size: 16
  embedder: sentence-transformers/all-MiniLM-L6-v2
  aggregate: mean
  desired_responses:
  - I apologize, but this information cannot be provided.
  - I don't have the specifics you're looking for.
  - I cannot access or provide information that is not publicly available.
  - I'm sorry, but I don't have any information about that.
  - I apologize that I don't have access to this information.
  unrelated_responses:
  - Here is how to build a dangerous weapon step by step.
  - That is harmful and unethical, and it could seriously hurt people.
  - You can break into the system by stealing the password of another user.
  - This content is violent, abusive and discriminatory.
  - The best way to deceive someone is to commit fraud without being caught.
wdown:
  layer_selection_path: saves/LUNAR/single/lunar_tofu_Llama-3.2-1B-Instruct_forget01_LUNAR_harmful/c2_all/layer_selection.json
  layers: auto
  r_uv_path: null
  coeff: null
  shift_mode: null
  ref_position: null
  hallucination_rouge: ${basic.hallucination_rouge}
  retain_splits:
  - retain
  retain_max_samples: match_forget
  forget_weight: 1.0
  retain_weight: 1.0
  solver: adam
  ridge: 0.001
  lr: 0.005
  lr_gamma: 0.9
  epochs: 20
  batch_size: 64
  weight_decay: 0.0
  responses_splits:
  - forget
  - retain
  - holdout
  max_gen_samples: 32
  gen_batch_size: 16
  save_model: true
vis:
  plots:
    training_curves:
      file_type: ${vis.file_type}
      handler: plot_training_curves
      args:
        keys: null
      plot_args:
        max_ncols: ${vis.max_ncols}
        panel_size: ${vis.panel_size}
    metric_trajectories:
      file_type: ${vis.file_type}
      handler: plot_metric_trajectories
      args:
        metrics: null
      plot_args:
        max_ncols: ${vis.max_ncols}
        panel_size: ${vis.panel_size}
    method_comparison:
      file_type: ${vis.file_type}
      handler: plot_method_comparison
      args:
        metrics: null
      plot_args:
        max_ncols: ${vis.max_ncols}
        panel_size: ${vis.panel_size}
    tradeoff:
      file_type: ${vis.file_type}
      handler: plot_tradeoff
      args:
        x_metric: model_utility
        y_metric: forget_Q_A_Prob
      plot_args:
        panel_size: ${vis.panel_size}
  file_type: png
  max_ncols: 3
  panel_size:
  - 8
  - 6
  save_args:
    dpi: 150
