hydra:
  run:
    dir: ${paths.output_dir}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(purple)sHYDRA%(reset)s] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(asctime)s][%(cyan)s%(name)s%(reset)s][%(log_color)s%(levelname)s%(reset)s]
          - %(message)s'
        log_colors:
          DEBUG: purple
          INFO: green
          WARNING: yellow
          ERROR: red
          CRITICAL: red
        datefmt: '%Y-%m-%d %H:%M:%S'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: utils.log.MkdirFileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/logs/${hydra.job.name}_${now:%Y-%m-%d}_${now:%H-%M-%S}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
    loggers:
      datasets:
        level: ERROR
        propagate: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - experiment=unlearn/tofu/NEAR
    - model=tofu/tofu_Llama-3.2-1B-Instruct_full
    - forget_split=forget01
    - neighbor_split=neighbor01
    - retain_split=retain99
    - holdout_split=holdout01
    - wdown.layer_selection_path=saves/NEAR/single/near_tofu_Llama-3.2-1B-Instruct_forget01/k5_c1_eoi/layer_selection.json
    - wdown.solver=adam
    - wdown.layers=auto
    - task_name=single/near_tofu_Llama-3.2-1B-Instruct_forget01
  job:
    name: w_down
    chdir: null
    override_dirname: experiment=unlearn/tofu/NEAR,forget_split=forget01,holdout_split=holdout01,model=tofu/tofu_Llama-3.2-1B-Instruct_full,neighbor_split=neighbor01,retain_split=retain99,task_name=single/near_tofu_Llama-3.2-1B-Instruct_forget01,wdown.layer_selection_path=saves/NEAR/single/near_tofu_Llama-3.2-1B-Instruct_forget01/k5_c1_eoi/layer_selection.json,wdown.layers=auto,wdown.solver=adam
    id: ???
    num: ???
    config_name: generate
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.0
    version_base: '1.3'
    cwd: /data/tianzhen/my_projects/LLM/llm_unlearning
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /data/tianzhen/my_projects/LLM/llm_unlearning/configs
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /data/tianzhen/my_projects/LLM/llm_unlearning/saves/NEAR/single/near_tofu_Llama-3.2-1B-Instruct_forget01
    choices:
      vis: default
      experiment: unlearn/tofu/NEAR
      data/packs@data.holdout: default_left
      data/collators@data.holdout.collator: default_left
      data/datasets@data.holdout.dataset: TOFU/TOFU_QA
      data/packs@data.retain: default_left
      data/collators@data.retain.collator: default_left
      data/datasets@data.retain.dataset: TOFU/TOFU_QA
      data/packs@data.neighbor: default_left
      data/collators@data.neighbor.collator: default_left
      data/datasets@data.neighbor.dataset: TOFU/TOFU_QA_csv
      data/packs@data.forget: default_left
      data/collators@data.forget.collator: default_left
      data/datasets@data.forget.dataset: TOFU/TOFU_QA
      generation@generation_args: default
      paths: default
      hydra: default
      data: null
      trainer: finetune
      trainer/args: default
      model: tofu/tofu_Llama-3.2-1B-Instruct_full
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: colorlog
      hydra/hydra_logging: colorlog
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
